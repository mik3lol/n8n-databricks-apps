env:
# N8N configuration
- name: N8N_PORT
  value: '8000'
- name: N8N_HOST
  value: 0.0.0.0
- name: N8N_COMMUNITY_PACKAGES_ALLOW_TOOL_USAGE
  value: 'true'

# **ELIMINADO: DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED (no se necesita para SQLite)**

- name: N8N_ENCRYPTION_KEY
  # Es buena práctica mantener esta clave incluso para pruebas.
  valueFrom: n8n-encryption-key 

# N8N Workflow Storage (SQLite por defecto)
# **ELIMINADO: EXECUTIONS_DATA_PRUNE, EXECUTIONS_DATA_MAX_AGE, etc.**
# *Nota: n8n usará SQLite por defecto si no se especifica DB_TYPE.*

# **ELIMINADO: Toda la configuración de Neon (DB_TYPE, DB_POSTGRESDB_HOST, etc.)**

# Webhook configuration
- name: WEBHOOK_URL
  # Mantener si vas a probar webhooks. Debe ser la URL de Databricks App.
  valueFrom: webhook-url
  
# **ELIMINADO: NGROK_TOKEN (no es necesario)**